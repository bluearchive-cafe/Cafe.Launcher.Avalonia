<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cafe Launcher — Dialog & Toast Design Draft</title>
  <style>
    :root {
      color-scheme: light;
      --wallpaper: #1d2037;
      --wallpaper-2: #514267;
      --surface: #fbf9ff;
      --surface-container: #f0eef7;
      --surface-high: #ffffff;
      --ink: #1a1b22;
      --muted: #687080;
      --outline: #ccd2df;
      --primary: #49649b;
      --primary-strong: #355388;
      --primary-soft: #dce5ff;
      --danger: #bb3e4c;
      --danger-soft: #ffe1e4;
      --success: #286f5e;
      --success-soft: #d9f4e9;
      --warning: #8a5b13;
      --warning-soft: #fff0c7;
      --info: #3d628f;
      --info-soft: #dfedff;
      --shadow: 0 24px 70px rgba(19, 22, 37, .25), 0 3px 10px rgba(19, 22, 37, .12);
      --shadow-toast: 0 16px 40px rgba(16, 19, 35, .22), 0 3px 8px rgba(16, 19, 35, .12);
      --radius-lg: 22px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --motion: 180ms cubic-bezier(.2, .8, .2, 1);
    }

    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      background: #171a2d;
      font: 14px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible { outline: 3px solid #8caeff; outline-offset: 3px; }

    .prototype-frame {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      isolation: isolate;
      background:
        linear-gradient(110deg, rgba(17, 20, 39, .86) 0%, rgba(36, 31, 63, .46) 53%, rgba(77, 58, 89, .26) 100%),
        url("../src/Cafe.Launcher.Avalonia/Assets/launcher-background.png") center / cover;
    }

    .prototype-frame::before {
      content: "";
      position: absolute;
      z-index: -1;
      width: 48vw;
      height: 48vw;
      min-width: 420px;
      min-height: 420px;
      top: -14vw;
      right: -4vw;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(136, 233, 242, .3), transparent 64%);
      filter: blur(14px);
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 72px;
      padding: 0 32px;
      color: #f8f8ff;
    }

    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 12px;
      color: #9beff4;
      background: rgba(255,255,255,.12);
      font-weight: 800;
    }
    .brand-name { font-size: 17px; font-weight: 750; letter-spacing: -.02em; }
    .brand-subtitle { margin-top: 1px; color: rgba(255,255,255,.62); font-size: 11px; }
    .header-actions { display: flex; gap: 8px; }
    .header-actions button {
      width: 38px;
      height: 38px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 12px;
      color: #fff;
      background: rgba(255,255,255,.08);
    }

    .app-main { width: min(1120px, calc(100% - 64px)); margin: 0 auto; padding: 70px 0 170px; }
    .eyebrow { color: #a8eaf0; font-size: 12px; font-weight: 750; letter-spacing: .13em; text-transform: uppercase; }
    .hero-title { max-width: 560px; margin: 12px 0 14px; color: #fff; font-size: clamp(34px, 5vw, 62px); line-height: .98; letter-spacing: -.065em; }
    .hero-copy { max-width: 500px; margin: 0; color: rgba(255,255,255,.74); font-size: 16px; }

    .library-card {
      width: min(790px, 100%);
      margin-top: 48px;
      padding: 20px;
      border: 1px solid rgba(255,255,255,.26);
      border-radius: 20px;
      color: #fff;
      background: rgba(13, 17, 35, .38);
      backdrop-filter: blur(16px);
    }
    .library-card-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .library-card h2 { margin: 0; font-size: 18px; }
    .library-card p { margin: 4px 0 0; color: rgba(255,255,255,.62); }
    .launch-button {
      min-height: 44px;
      padding: 0 18px;
      border: 0;
      border-radius: 11px;
      color: #fff;
      background: #5a79b5;
      font-weight: 750;
    }
    .progress-track { height: 7px; margin-top: 20px; overflow: hidden; border-radius: 99px; background: rgba(255,255,255,.16); }
    .progress-track span { display: block; width: 62%; height: 100%; border-radius: inherit; background: #98e8ec; }

    .dialog-overlay {
      position: fixed;
      z-index: 10;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 32px;
      background: rgba(8, 10, 21, .66);
      backdrop-filter: blur(3px);
    }
    .dialog {
      width: min(520px, 100%);
      max-height: 80vh;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.72);
      border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: var(--shadow);
      animation: dialog-in var(--motion) both;
    }
    .dialog.dialog-update { width: min(640px, 100%); }
    .dialog.dialog-error { width: min(560px, 100%); }
    .dialog-head { display: grid; grid-template-columns: 1fr 36px; gap: 14px; align-items: start; padding: 26px 28px 18px; }
    .dialog h2 { margin: 0; font-size: 21px; line-height: 1.15; letter-spacing: -.035em; }
    .dialog-description { margin: 6px 0 0; color: var(--muted); }
    .icon-button { border: 0; color: #687080; background: transparent; font-size: 21px; line-height: 1; }
    .icon-button:hover { color: var(--ink); }
    .dialog-body { max-height: 48vh; overflow: auto; padding: 0 28px 26px; }
    .dialog-copy { margin: 0; color: var(--ink); font-size: 14px; line-height: 1.55; }
    .dialog-copy p { margin: 0; }
    .dialog-copy strong { font-weight: 750; }
    .dialog-copy.danger-copy strong { color: var(--danger); }
    .dialog-note { margin-top: 16px; color: var(--muted); font-size: 13px; }
    .dialog-alert { margin: 0; padding: 12px 14px; border-left: 3px solid var(--info); border-radius: 4px 10px 10px 4px; color: var(--ink); background: var(--info-soft); font-size: 14px; line-height: 1.55; }
    .dialog-alert-head { display: flex; align-items: center; gap: 7px; margin-bottom: 3px; }
    .dialog-alert-icon { width: 17px; color: var(--info); font-size: 16px; font-weight: 850; line-height: 1; }
    .dialog-alert.warning { border-color: var(--warning); background: var(--warning-soft); }
    .dialog-alert.danger { border-color: var(--danger); background: var(--danger-soft); }
    .dialog-alert.warning .dialog-alert-icon, .dialog-alert.warning strong { color: var(--warning); }
    .dialog-alert.danger .dialog-alert-icon, .dialog-alert.danger strong { color: var(--danger); }
    .dialog-alert strong { color: var(--info); font-size: 12px; font-weight: 800; letter-spacing: .02em; }
    .dialog-alert p { margin: 0; }

    .file-list { display: grid; gap: 8px; margin-top: 4px; }
    .file-row { display: grid; grid-template-columns: 22px 1fr auto; gap: 12px; align-items: center; padding: 13px 14px; border: 1px solid var(--outline); border-radius: 12px; background: var(--surface-high); }
    .file-row.selected { border-color: var(--primary); background: #f0f4ff; box-shadow: inset 0 0 0 1px var(--primary); }
    .file-row input { accent-color: var(--primary); }
    .file-name { font-weight: 720; }
    .file-meta { margin-top: 2px; color: var(--muted); font-size: 12px; }
    .file-size { color: var(--muted); font-size: 12px; }

    .error-details { margin-top: 14px; padding: 13px 14px; border: 1px solid var(--outline); border-radius: 12px; color: var(--muted); background: var(--surface-container); font: 12px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; }
    .dialog-footer { display: flex; justify-content: space-between; gap: 12px; padding: 16px 28px 22px; border-top: 1px solid #e0e3eb; }
    .footer-actions { display: flex; justify-content: flex-end; gap: 10px; width: 100%; }
    .footer-actions button { min-height: 42px; padding: 0 17px; border-radius: 11px; font-weight: 720; }
    .button-secondary { border: 1px solid #c3ccdd; color: var(--ink); background: transparent; }
    .button-secondary:hover { background: #edf2fb; }
    .button-primary { border: 1px solid var(--primary); color: #fff; background: var(--primary); }
    .button-primary:hover { background: var(--primary-strong); }
    .button-danger { border: 1px solid var(--danger); color: #fff; background: var(--danger); }
    .button-danger:hover { background: #a9303d; }

    .toast-host { position: fixed; z-index: 20; top: 88px; right: 28px; display: grid; gap: 12px; width: min(390px, calc(100vw - 32px)); pointer-events: none; }
    .toast {
      position: relative;
      display: grid;
      grid-template-columns: 24px 1fr 32px;
      gap: 13px;
      min-height: 92px;
      overflow: hidden;
      border: 1px solid rgba(205, 211, 224, .92);
      border-radius: 16px;
      background: rgba(255,255,255,.96);
      box-shadow: var(--shadow-toast);
      padding-left: 14px;
      pointer-events: auto;
      animation: toast-in var(--motion) both;
    }
    .toast-icon { padding-top: 18px; color: var(--info); font-size: 18px; font-weight: 850; }
    .toast.success .toast-icon { color: var(--success); }
    .toast.warning .toast-icon { color: var(--warning); }
    .toast.error .toast-icon { color: var(--danger); }
    .toast-content { padding: 16px 0 15px; }
    .toast-title { font-weight: 760; }
    .toast-message { margin-top: 3px; color: #646d7b; font-size: 13px; }
    .toast-close { align-self: start; width: 32px; height: 32px; margin: 9px 8px 0 0; border: 0; border-radius: 9px; color: #8a92a0; background: transparent; font-size: 18px; }
    .toast-close:hover { color: var(--ink); background: #edf0f6; }
    .toast-actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 11px; }
    .toast-action { min-height: 30px; padding: 0 10px; border-radius: 8px; font-size: 12px; font-weight: 760; }
    .toast-action.primary { border: 0; color: #fff; background: var(--primary); }
    .toast-action.secondary { border: 1px solid #c4cede; color: var(--primary-strong); background: #fff; }
    .toast-progress { grid-column: 1 / 4; height: 3px; margin: 0 10px 8px 0; overflow: hidden; border-radius: 99px; background: #e4e8f1; }
    .toast-progress span { display: block; width: 38%; height: 100%; border-radius: inherit; background: var(--primary); animation: progress 1.1s ease-in-out infinite; }

    .demo-toolbar { position: fixed; z-index: 30; left: 50%; bottom: 20px; display: flex; align-items: center; gap: 9px; transform: translateX(-50%); padding: 8px; border: 1px solid rgba(255,255,255,.24); border-radius: 16px; color: #fff; background: rgba(16, 19, 36, .86); box-shadow: 0 16px 40px rgba(0,0,0,.28); backdrop-filter: blur(16px); }
    .demo-toolbar button { min-height: 34px; border: 0; border-radius: 10px; color: rgba(255,255,255,.7); background: transparent; }
    .demo-toolbar button:hover, .demo-toolbar button.active { color: #fff; background: rgba(255,255,255,.16); }
    .demo-toolbar .arrow { width: 34px; font-size: 18px; }
    .demo-toolbar .mode-label { min-width: 158px; padding: 0 11px; text-align: center; font-size: 12px; font-weight: 720; }
    .demo-toolbar .motion { padding: 0 10px; color: #9beff4; }
    .state-controls { position: fixed; z-index: 25; top: 92px; left: 28px; display: flex; flex-wrap: wrap; gap: 7px; width: min(300px, calc(100vw - 56px)); }
    .state-controls button { min-height: 32px; padding: 0 11px; border: 1px solid rgba(255,255,255,.2); border-radius: 9px; color: rgba(255,255,255,.8); background: rgba(12, 16, 33, .48); backdrop-filter: blur(12px); }
    .state-controls button:hover, .state-controls button.active { color: #fff; border-color: rgba(155,239,244,.72); background: rgba(73,100,155,.6); }

    .no-motion *, .no-motion *::before, .no-motion *::after { animation: none !important; transition: none !important; }
    .is-hidden { display: none !important; }
    @keyframes dialog-in { from { opacity: 0; transform: translateY(8px) scale(.985); } to { opacity: 1; transform: none; } }
    @keyframes toast-in { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }
    @keyframes progress { 0% { transform: translateX(-120%); } 50% { transform: translateX(120%); } 100% { transform: translateX(260%); } }

    @media (max-width: 720px) {
      .app-header { padding: 0 18px; }
      .app-main { width: min(100% - 36px, 560px); padding-top: 52px; }
      .library-card-head { align-items: flex-start; flex-direction: column; }
      .dialog-overlay { padding: 14px; }
      .dialog-head, .dialog-body { padding-left: 20px; padding-right: 20px; }
      .dialog-footer { padding-left: 20px; padding-right: 20px; }
      .toast-host { top: 76px; right: 16px; width: calc(100vw - 32px); }
      .state-controls { top: 78px; left: 18px; width: calc(100vw - 36px); }
      .state-controls button { background: rgba(12, 16, 33, .72); }
      .demo-toolbar { bottom: 12px; width: calc(100vw - 24px); justify-content: space-between; }
      .demo-toolbar .mode-label { min-width: 0; flex: 1; }
      .demo-toolbar .motion { display: none; }
    }
  </style>
</head>
<body>
  <!-- PROTOTYPE — throwaway visual design draft for Cafe Launcher dialogs and toasts. -->
  <main id="app" class="prototype-frame">
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark">C</div>
        <div><div class="brand-name">Cafe Launcher</div><div class="brand-subtitle">Blue Archive / desktop launcher</div></div>
      </div>
      <div class="header-actions"><button aria-label="Theme">◐</button><button aria-label="Settings">⚙</button><button aria-label="Close">×</button></div>
    </header>
    <section class="app-main">
      <div class="eyebrow">Design draft · surface language</div>
      <h1 class="hero-title">A calmer way to manage your launcher.</h1>
      <p class="hero-copy">Dialogs and notifications share one quiet, purposeful visual language so actions feel clear without competing with the artwork.</p>
      <div class="library-card">
        <div class="library-card-head"><div><h2>Blue Archive</h2><p>Ready to launch · Version 1.4.7</p></div><button class="launch-button">Launch game</button></div>
        <div class="progress-track"><span></span></div>
      </div>
    </section>

    <div id="stateControls" class="state-controls" aria-label="Dialog states"></div>
    <section id="toastHost" class="toast-host" aria-live="polite"></section>
    <section id="dialogHost"></section>

    <nav class="demo-toolbar" aria-label="Prototype view switcher">
      <button class="arrow" data-cycle="-1" aria-label="Previous view">‹</button>
      <button class="mode-label" id="modeLabel"></button>
      <button class="arrow" data-cycle="1" aria-label="Next view">›</button>
      <button class="motion" id="motionToggle">Motion on</button>
    </nav>
  </main>

  <script>
    const views = [
      { key: 'focus', label: 'Dialog focus' },
      { key: 'stack', label: 'Toast stack' },
      { key: 'combined', label: 'Combined state' }
    ];
    const dialogTypes = ['confirm', 'notice', 'update', 'error'];
    const dialogContent = {
      confirm: {
        title: 'Confirm Repair', description: 'This checks files against the latest manifest and repairs any issues.',
        body: '<blockquote class="dialog-alert warning"><div class="dialog-alert-head"><span class="dialog-alert-icon">⚠</span><strong>Repair plan</strong></div><p>Your personal settings will remain unchanged. This may take a few minutes.</p></blockquote><div class="dialog-note">You can continue using the launcher after the repair starts.</div>',
        buttons: '<button class="button-secondary" data-close>Cancel</button><button class="button-primary" data-close>Repair</button>'
      },
      notice: {
        title: 'Information', description: 'A short, non-blocking message with one clear acknowledgement.',
        body: '<blockquote class="dialog-alert"><div class="dialog-alert-head"><span class="dialog-alert-icon">ⓘ</span><strong>Download source</strong></div><p>The official mirror is now selected for the next update. You can change this later in Settings.</p></blockquote>',
        buttons: '<button class="button-primary" data-close>Got it</button>'
      },
      update: {
        title: 'Update available', description: 'Version 1.4.7 is ready. Choose a package to download.', className: 'dialog-update',
        body: '<div class="file-list"><label class="file-row selected"><input type="radio" name="file" checked><span><span class="file-name">CafeLauncher-win-x64.zip</span><span class="file-meta">Recommended · Windows x64</span></span><span class="file-size">84.2 MB</span></label><label class="file-row"><input type="radio" name="file"><span><span class="file-name">CafeLauncher-win-arm64.zip</span><span class="file-meta">Windows ARM64</span></span><span class="file-size">81.7 MB</span></label></div>',
        buttons: '<button class="button-secondary" data-close>Later</button><button class="button-primary" data-close>Download</button>'
      },
      error: {
        title: 'Something went wrong', description: 'The launcher could not complete the requested action.', className: 'dialog-error', danger: true,
        body: '<blockquote class="dialog-alert danger"><div class="dialog-alert-head"><span class="dialog-alert-icon">!</span><strong>Verification failed</strong></div><p>Game files could not be verified. Check your installation path and try again. If the problem continues, share the details with support.</p></blockquote><div class="error-details">ManifestMismatch: local package hash differs<br>Path: D:\\Games\\BlueArchive<br>Code: BA-204</div>',
        buttons: '<button class="button-secondary" data-close>View log</button><button class="button-secondary" data-close>Copy details</button><button class="button-danger" data-close>Continue</button>'
      }
    };
    let params = new URLSearchParams(location.search);
    let currentView = views.some(view => view.key === params.get('variant')) ? params.get('variant') : 'focus';
    let dialogType = 'confirm';
    let motionEnabled = true;
    let toastSeed = 4;
    let toasts = [
      { id: 1, tone: 'info', icon: 'i', title: 'Info', message: 'The next update will use the official mirror.', action: null },
      { id: 2, tone: 'success', icon: '✓', title: 'Ready', message: 'Game files are up to date.', action: 'Open game folder' },
      { id: 3, tone: 'warning', icon: '!', title: 'Attention', message: 'The selected game path needs review.', action: 'Review settings' }
    ];

    const el = id => document.getElementById(id);
    function setView(next) {
      currentView = next;
      const url = new URL(location.href);
      url.searchParams.set('variant', next);
      history.replaceState(null, '', url);
      render();
    }
    function renderStateControls() {
      el('stateControls').innerHTML = currentView === 'stack' ? '' : dialogTypes.map(type =>
        `<button class="${type === dialogType ? 'active' : ''}" data-dialog="${type}">${type[0].toUpperCase() + type.slice(1)}</button>`).join('');
    }
    function renderDialog() {
      const visible = currentView !== 'stack';
      if (!visible) { el('dialogHost').innerHTML = ''; return; }
      const content = dialogContent[dialogType];
      el('dialogHost').innerHTML = `<div class="dialog-overlay" data-overlay>
        <article class="dialog ${content.className || ''}" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
          <header class="dialog-head">
            <div><h2 id="dialogTitle">${content.title}</h2><p class="dialog-description">${content.description}</p></div>
            <button class="icon-button" data-close aria-label="Close">×</button>
          </header>
          <div class="dialog-body">${content.body}</div>
          <footer class="dialog-footer"><div class="footer-actions">${content.buttons}</div></footer>
        </article>
      </div>`;
    }
    function renderToasts() {
      const visible = currentView !== 'focus';
      el('toastHost').innerHTML = visible ? toasts.map(toast => `<article class="toast ${toast.tone}" data-toast="${toast.id}">
        <div class="toast-icon">${toast.icon}</div><div class="toast-content"><div class="toast-title">${toast.title}</div><div class="toast-message">${toast.message}</div>${toast.action ? `<div class="toast-actions"><button class="toast-action primary">${toast.action}</button><button class="toast-action secondary">Dismiss</button></div>` : ''}</div><button class="toast-close" data-dismiss="${toast.id}" aria-label="Close">×</button>
        ${toast.tone === 'warning' ? '<div class="toast-progress"><span></span></div>' : ''}
      </article>`).join('') : '';
    }
    function render() {
      el('app').classList.toggle('no-motion', !motionEnabled);
      el('modeLabel').textContent = views.find(view => view.key === currentView).label;
      el('motionToggle').textContent = motionEnabled ? 'Motion on' : 'Motion off';
      renderStateControls(); renderDialog(); renderToasts();
    }

    document.addEventListener('click', event => {
      const cycle = event.target.closest('[data-cycle]');
      if (cycle) {
        const index = views.findIndex(view => view.key === currentView);
        setView(views[(index + Number(cycle.dataset.cycle) + views.length) % views.length].key);
        return;
      }
      const dialogButton = event.target.closest('[data-dialog]');
      if (dialogButton) { dialogType = dialogButton.dataset.dialog; render(); return; }
      if (event.target.closest('#motionToggle')) { motionEnabled = !motionEnabled; render(); return; }
      const close = event.target.closest('[data-close]');
      if (close) { el('dialogHost').innerHTML = ''; return; }
      const dismiss = event.target.closest('[data-dismiss]');
      if (dismiss) { toasts = toasts.filter(toast => String(toast.id) !== dismiss.dataset.dismiss); renderToasts(); return; }
    });
    document.addEventListener('keydown', event => {
      if (event.target.matches('input, textarea, [contenteditable]')) return;
      if (event.key === 'ArrowLeft') setView(views[(views.findIndex(view => view.key === currentView) + views.length - 1) % views.length].key);
      if (event.key === 'ArrowRight') setView(views[(views.findIndex(view => view.key === currentView) + 1) % views.length].key);
      if (event.key === 'Escape' && currentView !== 'stack') el('dialogHost').innerHTML = '';
    });
    render();
  </script>
</body>
</html>
