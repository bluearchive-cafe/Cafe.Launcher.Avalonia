name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40

    defaults:
      run:
        shell: pwsh

    env:
      Project_Path: src/Cafe.Launcher.Avalonia/Cafe.Launcher.Avalonia.csproj
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      AVALONIA_TELEMETRY_OPTOUT: 1
      # 供应链闭环：SDK 不会从 CI 环境自动推断这两个属性（dotnet/sdk#23795），
      # 必须显式设置。RestoreLockedMode 使 restore 与提交的 packages.lock.json
      # 不一致时直接失败（NU1004），锁定完整传递依赖闭包。
      ContinuousIntegrationBuild: 'true'
      RestoreLockedMode: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json
            Directory.Packages.props

      - name: Test
        run: .\test.ps1 -Configuration Debug

      - name: Coverage
        run: .\coverage.ps1

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-and-coverage-reports
          retention-days: 14
          path: |
            TestResults/**/*.trx
            TestResults/Coverage/**/coverage.cobertura.xml

      - name: Restore (win-x64)
        env:
          # NuGet lock 文件只能固定一个 RID 上下文（每个 -r restore 会重写
          # runtimeIdentifier 字段），因此提交的 lock 固定的是无 RID 的
          # net10.0 依赖图；RID 专属发布还原无法使用 locked mode，显式豁免。
          RestoreLockedMode: 'false'
        run: dotnet restore $env:Project_Path -r win-x64

      - name: Publish (Release, win-x64)
        env:
          RestoreLockedMode: 'false'
        run: dotnet publish $env:Project_Path -c Release -r win-x64 -o publish --no-restore
