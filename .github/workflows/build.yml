name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    env:
      Project_Path: Cafe.Launcher.Avalonia.csproj
      NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      AVALONIA_TELEMETRY_OPTOUT: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore (Debug)
        run: dotnet restore $env:Project_Path

      - name: Restore tests
        run: |
          dotnet restore tests/Cafe.Launcher.Avalonia.Tests/Cafe.Launcher.Avalonia.Tests.csproj
          dotnet restore tests/Cafe.Launcher.Avalonia.HeadlessTests/Cafe.Launcher.Avalonia.HeadlessTests.csproj

      - name: Build (Debug)
        run: dotnet build $env:Project_Path -c Debug --no-restore

      - name: Test
        run: |
          dotnet test tests/Cafe.Launcher.Avalonia.Tests/Cafe.Launcher.Avalonia.Tests.csproj -c Debug --no-restore
          dotnet test tests/Cafe.Launcher.Avalonia.HeadlessTests/Cafe.Launcher.Avalonia.HeadlessTests.csproj -c Debug --no-restore

      - name: Restore (Release)
        run: dotnet restore $env:Project_Path -r win-x64

      - name: Build (Release)
        run: dotnet build $env:Project_Path -c Release --no-restore

      - name: Publish (Release)
        run: dotnet publish $env:Project_Path -c Release -o publish --no-restore
