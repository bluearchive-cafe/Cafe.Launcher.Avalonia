name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40

    defaults:
      run:
        shell: pwsh

    env:
      Project_Path: src/Cafe.Launcher/Cafe.Launcher.csproj
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      TESTINGPLATFORM_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      AVALONIA_TELEMETRY_OPTOUT: 1
      # 供应链闭环：SDK 不会从 CI 环境自动推断这两个属性（dotnet/sdk#23795），
      # 必须显式设置。RestoreLockedMode 使 restore 与提交的 packages.lock.json
      # 不一致时直接失败（NU1004），锁定完整传递依赖闭包。
      ContinuousIntegrationBuild: 'true'
      RestoreLockedMode: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      # 纯文本扫描（resx 四语言 key 对齐 + C# 禁裸 key），无 dotnet 依赖。
      - name: Localization contract
        run: .\scripts\Test-LocalizationContract.ps1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          # Pinned to the SDK named by global.json. `10.0.x` resolved to whatever the runner
          # carried that day, which decides the Microsoft.NETCore.App version published inside
          # every self-contained artifact without leaving a trace in the repository.
          dotnet-version: 10.0.403

      # NuGet 全局包缓存（~/.nuget/packages）。不使用 setup-dotnet 的 `cache: true`：
      # 它的键是 `dotnet-cache-<os>-<hashFiles(**/*.csproj, **/packages.lock.json, Directory.Packages.props)>`，
      # 每次依赖文件字节变化就产生一个全新的 600~800 MB 条目（旧条目不复用也不删除），单仓库 10 GB 缓存
      # 上限被反复顶满。这里的键只由依赖版本清单决定：版本没动就命中同一条目，只有版本真的变化才写新条目。
      # 读写拆成两步：`actions/cache` 的保存是 post 步骤且只在 success() 时执行，本仓库测试红着的时候
      # 缓存永远写不进去，而拆开后的保存步骤带 `if: always()`。
      - name: Restore NuGet cache
        id: nuget-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-global-packages-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-global-packages-${{ runner.os }}-

      - name: Test with coverage (Debug)
        run: .\coverage.ps1

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-and-coverage-reports
          retention-days: 7
          path: |
            TestResults/**/*.trx
            TestResults/Coverage/**/*.cobertura.xml
            # Golden-screenshot failures write <name>-actual.png / <name>-diff.png here. They are
            # the only diff evidence for the one test class whose baselines are environment
            # sensitive, so a CI-only mismatch must not have to be reproduced locally to triage.
            TestResults/Golden/*.png

      # AUD-CI-007：整套 Release 配置的测试此前只在 tag 触发的 release.yml 里跑，而 Debug/Release
      # 的行为差异是真实的——UnifiedLogger 的级别开关在 #if DEBUG 下取 Verbose、否则取 Information，
      # 于是「Debug 级条目在 Release 被丢弃」这类断言要到发版那一刻才第一次执行（重置前台账记录过
      # 一次实际事故：tag 构建红、发布作业被 needs 挡住、补提交后重打 tag）。这里补上单元套件的
      # Release 运行：它正是这类分歧的宿主，成本约 30 秒。无头套件的 Release 运行仍留在 release.yml
      # 的 installer 作业（它的分歧面窄、且整套跑一遍要一分钟以上）。
      #
      # 这一步必须留在本作业带覆盖率的 Debug 测试之后：其还原把
      # packages.lock.json 的 RID 段改写为 win-x64，再跑任何 locked mode 的无 RID 还原都会
      # NU1004（2026-09-22 CI 复查：它原先排在 Coverage 之前，coverage.ps1 的还原因此失败）。
      - name: Test (Release)
        env:
          # Release 配置在 csproj 中声明 SelfContained=true，dotnet test -c Release
          # 的还原会按当前平台 RID（windows-latest 上为 win-x64）解析依赖图，与
          # 提交的无 RID 段 lock 无法在 locked mode 下匹配（NU1004）。与 build job
          # 对 RID 还原的显式豁免同理，测试还原也豁免 locked mode。
          RestoreLockedMode: 'false'
        run: .\test.ps1 -Configuration Release -Suite Unit

      - name: Restore (win-x64)
        env:
          # NuGet lock 文件只能固定一个 RID 上下文（每个 -r restore 会重写
          # runtimeIdentifier 字段），因此提交的 lock 固定的是无 RID 的
          # net10.0 依赖图；RID 专属发布还原无法使用 locked mode，显式豁免。
          RestoreLockedMode: 'false'
        run: dotnet restore $env:Project_Path -r win-x64

      - name: Publish (Release, win-x64)
        env:
          RestoreLockedMode: 'false'
        run: dotnet publish $env:Project_Path -c Release -r win-x64 -o publish --no-restore

      # 键已存在时 save 是空操作，测试失败也必须走到这里，否则缓存只在绿灯时更新。
      - name: Save NuGet cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ steps.nuget-cache.outputs.cache-primary-key }}

  # AUD-CI-001（更新助手与安装器脚本）：更新助手和 installer/windows/Cafe.Launcher.iss
  # 两条编译路径此前只在 tag 触发的 release.yml 里跑，编译断裂要等到发版那一刻才暴露，
  # 届时只能移动 tag 或追加提交。本作业在每次推送与 PR 上重放发布同款步骤：以发布所用
  # 的 Release + win-x64 配置构建更新助手（Release 才是发布配置，SelfContained 只在
  # Release 声明），再用 release.yml 相同的方式装上来源证明校验过的 Inno Setup 7，并由
  # 发布同款脚本真的编译一次安装器。
  #
  # 与 build 作业并行而不是接在它后面：接在后面会直接给每次 PR 加数分钟墙钟时间；并行时
  # 总时长取两者的较大值（通常仍是 build 作业）。代价是本作业重复一次 win-x64 发布——ISCC
  # 的 Source 需要真实发布目录，Test-WindowsPublishOutput.ps1 也会据此校验主程序、更新助手
  # 与钉住哈希的 libmpv。缓存只读不写：同一条目的写入留给 build 作业的 if: always() 保存，
  # 两个作业同时写同一个键只会有一个生效，另一个收到「缓存已存在」警告。
  installer-compile:
    name: Updater and installer compile
    runs-on: windows-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: pwsh

    env:
      Project_Path: src/Cafe.Launcher/Cafe.Launcher.csproj
      Updater_Project_Path: src/Cafe.Launcher.Updater/Cafe.Launcher.Updater.csproj
      INNO_SETUP_VERSION: 7.1.0
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      AVALONIA_TELEMETRY_OPTOUT: 1
      # 与 build 作业相同的锁定还原与确定性构建；下面的 RID 步骤单独豁免。
      ContinuousIntegrationBuild: 'true'
      RestoreLockedMode: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          # Pinned to the SDK named by global.json, same as the build job.
          dotnet-version: 10.0.403

      - name: Restore NuGet cache
        id: nuget-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-global-packages-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-global-packages-${{ runner.os }}-

      # 两个工程都按 win-x64 还原：RID 专属的还原会重写 packages.lock.json 的 RID 段，
      # 与提交的无 RID 段无法在 locked mode 下匹配，与 build 作业的发布还原同理豁免。
      # 每条命令各自检查 $LASTEXITCODE：pwsh 只在步骤最后一条命令失败时判红，前一条的
      # restore 失败不能靠后一条掩盖。
      - name: Restore (win-x64)
        env:
          RestoreLockedMode: 'false'
        run: |
          dotnet restore $env:Project_Path -r win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore $env:Updater_Project_Path -r win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 顺序与 Build-Distribution.ps1 一致（先主程序、再助手）：两者写同一个发布目录，
      # 助手的发布建立在使用同一目录的主程序发布之后。
      - name: Publish (Release, win-x64)
        env:
          RestoreLockedMode: 'false'
        run: dotnet publish $env:Project_Path -c Release -r win-x64 -o publish --no-restore

      # 更新助手的独立构建：就是文档里的单独构建命令，只是改用发布配置（Debug 不声明
      # SelfContained／PublishSingleFile／PublishTrimmed，构建不到发布真正走的路径）。
      # Build-Distribution.ps1 用同一条命令把单文件助手放进发布目录，所以这里的红就是
      # 发布时会遇到的红；产物也正好补上安装器发布目录里必需的 Cafe.Launcher.Updater.exe。
      - name: Build and publish updater (Release, win-x64)
        env:
          RestoreLockedMode: 'false'
        run: dotnet publish $env:Updater_Project_Path -c Release -r win-x64 -o publish --no-restore

      # 与 release.yml 的 installer 作业完全相同的安装方式：从 jrsoftware/issrc 下载固定
      # 版本的安装包、校验 GitHub release attestation 后再静默安装，最后确认 ISCC 是 7.x。
      # 不用 choco：那条路径没有来源证明，仓库测试也禁止。
      - name: Install Inno Setup 7
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assetName = "innosetup-$env:INNO_SETUP_VERSION-x64.exe"
          $releaseTag = "is-$($env:INNO_SETUP_VERSION.Replace('.', '_'))"
          $installerPath = Join-Path $env:RUNNER_TEMP $assetName

          gh release download $releaseTag `
              --repo jrsoftware/issrc `
              --pattern $assetName `
              --dir $env:RUNNER_TEMP `
              --clobber
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to download Inno Setup $env:INNO_SETUP_VERSION."
          }

          gh release verify-asset $releaseTag $installerPath --repo jrsoftware/issrc
          if ($LASTEXITCODE -ne 0) {
              throw "GitHub release attestation verification failed for $assetName."
          }

          $process = Start-Process -FilePath $installerPath `
              -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' `
              -Wait `
              -PassThru
          if ($process.ExitCode -ne 0) {
              throw "Inno Setup installation failed with exit code $($process.ExitCode)."
          }

          $isccPath = Join-Path $env:ProgramFiles 'Inno Setup 7\ISCC.exe'
          $installedVersion = (& $isccPath --version | Select-Object -First 1)
          if ($LASTEXITCODE -ne 0 -or $installedVersion -notmatch '^7\.') {
              throw "Expected Inno Setup 7.x, found '$installedVersion'."
          }
          Write-Host "Using Inno Setup $installedVersion"

      # New-WindowsInstaller.ps1 先跑 Test-WindowsPublishOutput.ps1（主程序、更新助手、
      # 钉住哈希的 libmpv 与披露文件），再用与发布相同的 -d 定义调用 ISCC。预处理定义、
      # 语言文件缺失或 PascalScript 语法损坏都会在这里让 PR 变红，而不是等到打 tag。
      - name: Compile Windows installer
        run: ./scripts/New-WindowsInstaller.ps1 -PublishDir publish -OutputDir artifacts/distribution

  # AUD-CI-001：产品以实验性形态分发 Linux/macOS 包，平台分支（路径分隔符、
  # .desktop 快捷方式、runner 归一化）必须在随变更执行的 CI 上运行，而不只是
  # 每周的 linux-tests.yml。单元套件无 Avalonia 渲染依赖，提交的 lock 固定的
  # 无 RID 依赖图在 Linux 上同样成立；Headless/golden 套件按设计保持 Windows-only。
  linux-unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      TESTINGPLATFORM_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      AVALONIA_TELEMETRY_OPTOUT: 1
      ContinuousIntegrationBuild: 'true'
      RestoreLockedMode: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          # Pinned to the SDK named by global.json, same as the Windows build job.
          dotnet-version: 10.0.403

      - name: Restore NuGet cache
        id: nuget-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-global-packages-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-global-packages-${{ runner.os }}-

      - name: Unit tests
        run: >
          dotnet test --project tests/Cafe.Launcher.Tests/Cafe.Launcher.Tests.csproj
          -c Debug --report-trx --results-directory TestResults
          --hangdump --hangdump-timeout 5m --hangdump-type None

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-unit-test-results
          retention-days: 7
          path: TestResults/**/*.trx

      - name: Save NuGet cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ steps.nuget-cache.outputs.cache-primary-key }}
