name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: pwsh

    env:
      Project_Path: Cafe.Launcher.Avalonia.csproj
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      AVALONIA_TELEMETRY_OPTOUT: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Test
        run: dotnet test tests/Cafe.Launcher.Avalonia.Tests/Cafe.Launcher.Avalonia.Tests.csproj -c Debug

      - name: Restore (Debug, win-x64)
        run: dotnet restore $env:Project_Path -r win-x64

      - name: Build (Debug, win-x64)
        run: dotnet build $env:Project_Path -c Debug -r win-x64 --no-restore

      - name: Restore (Release, win-x64)
        run: dotnet restore $env:Project_Path -r win-x64

      - name: Build (Release, win-x64)
        run: dotnet build $env:Project_Path -c Release -r win-x64 --no-restore

      - name: Publish (Release, win-x64)
        run: dotnet publish $env:Project_Path -c Release -r win-x64 -o publish --no-restore
