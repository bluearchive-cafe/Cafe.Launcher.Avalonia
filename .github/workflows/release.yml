name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  build:
    name: Build platform packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        shell: pwsh

    env:
      Project_Path: src/Cafe.Launcher.Avalonia/Cafe.Launcher.Avalonia.csproj
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      AVALONIA_TELEMETRY_OPTOUT: 1
      # 供应链闭环：SDK 不会从 CI 环境自动推断这两个属性（dotnet/sdk#23795），
      # 必须显式设置；RID 专属发布还原步骤显式豁免 RestoreLockedMode。
      ContinuousIntegrationBuild: 'true'
      RestoreLockedMode: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            '**/*.csproj'
            '**/packages.lock.json'
            'Directory.Packages.props'

      - name: Install Linux packaging and smoke-test dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y dpkg xvfb xauth libx11-6 libice6 libsm6 libfontconfig1 libxkbcommon0

      - name: Acquire pinned AppImage tools
        env:
          APPIMAGETOOL_SHA256: 'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0'
          APPIMAGE_RUNTIME_SHA256: '2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d'
        run: |
          curl -fL --retry 3 -o appimagetool-x86_64.AppImage "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage"
          curl -fL --retry 3 -o runtime-x86_64 "https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64"
          echo "${APPIMAGETOOL_SHA256}  appimagetool-x86_64.AppImage" | sha256sum -c -
          echo "${APPIMAGE_RUNTIME_SHA256}  runtime-x86_64" | sha256sum -c -
          chmod +x appimagetool-x86_64.AppImage

      - name: Build distribution packages
        env:
          # NuGet lock 文件只能固定一个 RID 上下文（每个 -r restore 会重写
          # runtimeIdentifier 字段），因此提交的 lock 固定的是无 RID 的
          # net10.0 依赖图；三个 RID 的发布还原无法使用 locked mode，显式豁免。
          RestoreLockedMode: 'false'
          # tag 名经 env 传递而非文本插值，消除 run 脚本的注入面。
          Release_Tag: ${{ github.ref_name }}
        run: |
          $buildArguments = @{
              Rids = 'win-x64', 'osx-arm64', 'linux-x64'
              AppImageToolPath = './appimagetool-x86_64.AppImage'
              AppImageRuntimePath = './runtime-x86_64'
          }
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
              $buildArguments.Tag = $env:Release_Tag
          }
          ./scripts/Build-Distribution.ps1 @buildArguments

      - name: Verify Debian package and smoke test AppImage
        shell: bash
        run: |
          debs=(artifacts/distribution/*_linux-x64.deb)
          if [[ ${#debs[@]} -ne 1 || ! -f "${debs[0]}" ]]; then
            echo "Expected exactly one Linux Debian package." >&2
            exit 1
          fi
          [[ $(dpkg-deb --field "${debs[0]}" Package) == cafe-launcher ]]
          [[ $(dpkg-deb --field "${debs[0]}" Architecture) == amd64 ]]
          mkdir -p "$RUNNER_TEMP/deb-root"
          dpkg-deb --extract "${debs[0]}" "$RUNNER_TEMP/deb-root"
          test -x "$RUNNER_TEMP/deb-root/usr/bin/cafe-launcher"
          test -x "$RUNNER_TEMP/deb-root/opt/cafe-launcher/Cafe.Launcher.Avalonia"
          sudo apt-get install --no-install-recommends -y "./${debs[0]}"
          test "$(command -v cafe-launcher)" = /usr/bin/cafe-launcher
          cafe-launcher --version

          appimages=(artifacts/distribution/*_linux-x64.AppImage)
          if [[ ${#appimages[@]} -ne 1 || ! -f "${appimages[0]}" ]]; then
            echo "Expected exactly one Linux AppImage artifact." >&2
            exit 1
          fi

          set +e
          timeout --kill-after=5s 10s xvfb-run -a -s "-screen 0 1280x720x24" "${appimages[0]}"
          status=$?
          set -e
          if [[ $status -ne 124 ]]; then
            echo "AppImage exited before the desktop startup smoke-test timeout (status $status)." >&2
            exit 1
          fi

      - name: Prepare changelog
        if: github.event_name == 'push'
        env:
          Ref: ${{ github.ref }}
        run: |
          if (Test-Path "CHANGELOG_RELEASE.md") {
            Copy-Item "CHANGELOG_RELEASE.md" "changelog.md"
            Write-Host "Using maintained CHANGELOG_RELEASE.md"
          } else {
            $lastTag = git describe --tags --abbrev=0 "$env:Ref^" 2>$null
            $parameters = @{
              CurrentRef = "$env:Ref^"
              OutputPath = "changelog.md"
            }
            if ($lastTag) {
              Write-Host "Last tag: $lastTag"
              $parameters.PreviousTag = $lastTag
            } else {
              Write-Host "No previous tag — using all commits"
            }
            ./scripts/New-ReleaseChangelog.ps1 @parameters
            Write-Host "Fallback changelog generated"
          }

      - name: Verify release banner
        if: github.event_name == 'push'
        env:
          Release_Tag: ${{ github.ref_name }}
        run: |
          $bannerPath = "docs/assets/release-banners/cafe-launcher-$env:Release_Tag-release-banner.png"
          if (-not (Test-Path $bannerPath -PathType Leaf)) {
            throw "Release banner must be committed to the source repository: $bannerPath"
          }
          Write-Host "Using repository release banner: $bannerPath"

      - name: Upload platform packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: distribution-packages
          path: artifacts/distribution/*
          retention-days: 1

      - name: Upload win-x64 publish output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: publish-win-x64
          path: artifacts/publish/win-x64/
          retention-days: 1

      - name: Upload changelog
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: changelog
          path: changelog.md
          retention-days: 1

  installer:
    name: Release tests and Windows installer
    runs-on: windows-latest
    needs: build
    timeout-minutes: 25

    defaults:
      run:
        shell: pwsh

    env:
      Project_Path: src/Cafe.Launcher.Avalonia/Cafe.Launcher.Avalonia.csproj
      INNO_SETUP_VERSION: 7.1.0
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      AVALONIA_TELEMETRY_OPTOUT: 1
      # 供应链闭环：与 build job 相同的锁定还原与确定性构建。
      ContinuousIntegrationBuild: 'true'
      RestoreLockedMode: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Install Inno Setup 7
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assetName = "innosetup-$env:INNO_SETUP_VERSION-x64.exe"
          $releaseTag = "is-$($env:INNO_SETUP_VERSION.Replace('.', '_'))"
          $installerPath = Join-Path $env:RUNNER_TEMP $assetName

          gh release download $releaseTag `
              --repo jrsoftware/issrc `
              --pattern $assetName `
              --dir $env:RUNNER_TEMP `
              --clobber
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to download Inno Setup $env:INNO_SETUP_VERSION."
          }

          gh release verify-asset $releaseTag $installerPath --repo jrsoftware/issrc
          if ($LASTEXITCODE -ne 0) {
              throw "GitHub release attestation verification failed for $assetName."
          }

          $process = Start-Process -FilePath $installerPath `
              -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' `
              -Wait `
              -PassThru
          if ($process.ExitCode -ne 0) {
              throw "Inno Setup installation failed with exit code $($process.ExitCode)."
          }

          $isccPath = Join-Path $env:ProgramFiles 'Inno Setup 7\ISCC.exe'
          $installedVersion = (& $isccPath --version | Select-Object -First 1)
          if ($LASTEXITCODE -ne 0 -or $installedVersion -notmatch '^7\.') {
              throw "Expected Inno Setup 7.x, found '$installedVersion'."
          }
          Write-Host "Using Inno Setup $installedVersion"

      - name: Test
        run: .\test.ps1 -Configuration Release

      - name: Download win-x64 publish output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: publish-win-x64
          path: artifacts/publish/win-x64

      - name: Build Windows installer
        env:
          Release_Tag: ${{ github.ref_name }}
        run: |
          $tagArguments = @{}
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
              $tagArguments.Tag = $env:Release_Tag
          }
          ./scripts/New-WindowsInstaller.ps1 @tagArguments

      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: installer-package
          path: artifacts/distribution/Cafe.Launcher.Avalonia_*_setup.exe
          retention-days: 1

  release:
    name: Publish GitHub releases
    runs-on: ubuntu-latest
    needs: [ build, installer ]
    if: github.event_name == 'push'
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Download platform packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: distribution-packages
          path: artifacts/distribution

      - name: Download Windows installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: installer-package
          path: artifacts/distribution

      - name: Download changelog
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: changelog
          path: .

      - name: Append platform download links
        shell: bash
        env:
          Release_Tag: ${{ github.ref_name }}
        run: |
          tag="$Release_Tag"
          source_base="${{ github.server_url }}/${{ github.repository }}/releases/download/${tag}"
          # Keep in sync with LauncherConstants.GitHubReleaseRepositorySlug
          distribution_base="${{ github.server_url }}/bluearchive-cafe/Cafe.Launcher.Avalonia_Release/releases/download/${tag}"

          download_section() {
            local base="$1" output="$2"
            {
              echo ""
              echo "## 下载"
              echo ""
              local entry name
              while IFS='|' read -r suffix label; do
                for entry in artifacts/distribution/Cafe.Launcher.Avalonia_*_"${suffix}"; do
                  if [[ -f "$entry" ]]; then
                    name="$(basename "$entry")"
                    echo "- ${label}：[${name}](${base}/${name})"
                  fi
                done
              done <<'ORDER'
          setup.exe|Windows 安装器（x64）
          win-x64.zip|Windows 便携版（x64）
          osx-arm64.zip|macOS 便携版（Apple Silicon）
          linux-x64.tar.gz|Linux 便携压缩包（x64）
          linux-x64.AppImage|Linux AppImage（x64）
          linux-x64.deb|Linux deb 安装包（x64）
          ORDER
            } >> "$output"
          }

          cp changelog.md changelog-source.md
          cp changelog.md changelog-distribution.md
          download_section "$source_base" changelog-source.md
          download_section "$distribution_base" changelog-distribution.md
          mv changelog-source.md changelog.md

      - name: Create source repository release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: changelog.md
          files: |
            artifacts/distribution/Cafe.Launcher.Avalonia_${{ github.ref_name }}_win-x64.zip
            artifacts/distribution/Cafe.Launcher.Avalonia_${{ github.ref_name }}_setup.exe
            artifacts/distribution/Cafe.Launcher.Avalonia_${{ github.ref_name }}_osx-arm64.zip
            artifacts/distribution/Cafe.Launcher.Avalonia_${{ github.ref_name }}_linux-x64.tar.gz
            artifacts/distribution/Cafe.Launcher.Avalonia_${{ github.ref_name }}_linux-x64.AppImage
            artifacts/distribution/Cafe.Launcher.Avalonia_${{ github.ref_name }}_linux-x64.deb
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true

      - name: Create distribution repository release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          # Keep in sync with LauncherConstants.GitHubReleaseRepositorySlug
          repository: bluearchive-cafe/Cafe.Launcher.Avalonia_Release
          token: ${{ secrets.RELEASE_REPOSITORY_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: changelog-distribution.md
          files: |
            artifacts/distribution/Cafe.Launcher.Avalonia_${{ github.ref_name }}_win-x64.zip
            artifacts/distribution/Cafe.Launcher.Avalonia_${{ github.ref_name }}_setup.exe
            artifacts/distribution/Cafe.Launcher.Avalonia_${{ github.ref_name }}_osx-arm64.zip
            artifacts/distribution/Cafe.Launcher.Avalonia_${{ github.ref_name }}_linux-x64.tar.gz
            artifacts/distribution/Cafe.Launcher.Avalonia_${{ github.ref_name }}_linux-x64.AppImage
            artifacts/distribution/Cafe.Launcher.Avalonia_${{ github.ref_name }}_linux-x64.deb
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
