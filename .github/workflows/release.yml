name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: pwsh

    env:
      Project_Path: src/Cafe.Launcher.Avalonia/Cafe.Launcher.Avalonia.csproj
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      AVALONIA_TELEMETRY_OPTOUT: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install NSIS
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes nsis
          makensis -VERSION

      - name: Test
        run: .\test.ps1 -Configuration Release

      - name: Restore (Release, win-x64)
        run: dotnet restore $env:Project_Path -r win-x64

      - name: Build (Release, win-x64)
        run: dotnet build $env:Project_Path -c Release -r win-x64 --no-restore

      - name: Build distribution artifacts
        run: |
          $result = .\scripts\Build-Distribution.ps1 -Tag "${{ github.ref_name }}"
          $standaloneName = Split-Path -Leaf $result.StandalonePath
          $setupName = Split-Path -Leaf $result.SetupPath
          "standalone_name=$standaloneName" >> $env:GITHUB_ENV
          "setup_name=$setupName" >> $env:GITHUB_ENV

      - name: Prepare changelog
        run: |
          if (Test-Path "CHANGELOG_RELEASE.md") {
            Copy-Item "CHANGELOG_RELEASE.md" "changelog.md"
            Write-Host "Using maintained CHANGELOG_RELEASE.md"
          } else {
            $lastTag = git describe --tags --abbrev=0 ${{ github.ref }}^ 2>$null
            $parameters = @{
              CurrentRef = "${{ github.ref }}^"
              OutputPath = "changelog.md"
            }
            if ($lastTag) {
              Write-Host "Last tag: $lastTag"
              $parameters.PreviousTag = $lastTag
            } else {
              Write-Host "No previous tag — using all commits"
            }
            .\scripts\New-ReleaseChangelog.ps1 @parameters
            Write-Host "Fallback changelog generated"
          }

      - name: Create source repository release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: changelog.md
          files: |
            artifacts/distribution/${{ env.standalone_name }}
            artifacts/distribution/${{ env.setup_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true

      - name: Create distribution repository release
        uses: softprops/action-gh-release@v2
        with:
          # Keep in sync with LauncherConstants.GitHubReleaseRepositorySlug
          repository: bluearchive-cafe/Cafe.Launcher.Avalonia_Release
          token: ${{ secrets.RELEASE_REPOSITORY_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: changelog.md
          files: |
            artifacts/distribution/${{ env.standalone_name }}
            artifacts/distribution/${{ env.setup_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
