name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  build:
    name: Build platform packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        shell: pwsh

    env:
      Project_Path: src/Cafe.Launcher.Avalonia/Cafe.Launcher.Avalonia.csproj
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      AVALONIA_TELEMETRY_OPTOUT: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Acquire pinned AppImage tools
        env:
          APPIMAGETOOL_SHA256: 'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0'
          APPIMAGE_RUNTIME_SHA256: '2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d'
        run: |
          curl -fL --retry 3 -o appimagetool-x86_64.AppImage "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage"
          curl -fL --retry 3 -o runtime-x86_64 "https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64"
          echo "${APPIMAGETOOL_SHA256}  appimagetool-x86_64.AppImage" | sha256sum -c -
          echo "${APPIMAGE_RUNTIME_SHA256}  runtime-x86_64" | sha256sum -c -
          chmod +x appimagetool-x86_64.AppImage

      - name: Build distribution packages
        run: |
          $buildArguments = @{
              Rids = 'win-x64', 'osx-arm64', 'linux-x64'
              AppImageToolPath = './appimagetool-x86_64.AppImage'
              AppImageRuntimePath = './runtime-x86_64'
          }
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
              $buildArguments.Tag = '${{ github.ref_name }}'
          }
          ./scripts/Build-Distribution.ps1 @buildArguments

      - name: Smoke test AppImage desktop startup
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth libx11-6 libice6 libsm6 libfontconfig1
          appimages=(artifacts/distribution/*_linux-x64.AppImage)
          if [[ ${#appimages[@]} -ne 1 || ! -f "${appimages[0]}" ]]; then
            echo "Expected exactly one Linux AppImage artifact." >&2
            exit 1
          fi

          set +e
          timeout --kill-after=5s 10s xvfb-run -a -s "-screen 0 1280x720x24" "${appimages[0]}"
          status=$?
          set -e
          if [[ $status -ne 124 ]]; then
            echo "AppImage exited before the desktop startup smoke-test timeout (status $status)." >&2
            exit 1
          fi

      - name: Prepare changelog
        if: github.event_name == 'push'
        run: |
          if (Test-Path "CHANGELOG_RELEASE.md") {
            Copy-Item "CHANGELOG_RELEASE.md" "changelog.md"
            Write-Host "Using maintained CHANGELOG_RELEASE.md"
          } else {
            $lastTag = git describe --tags --abbrev=0 ${{ github.ref }}^ 2>$null
            $parameters = @{
              CurrentRef = "${{ github.ref }}^"
              OutputPath = "changelog.md"
            }
            if ($lastTag) {
              Write-Host "Last tag: $lastTag"
              $parameters.PreviousTag = $lastTag
            } else {
              Write-Host "No previous tag — using all commits"
            }
            ./scripts/New-ReleaseChangelog.ps1 @parameters
            Write-Host "Fallback changelog generated"
          }

      - name: Verify release banner
        if: github.event_name == 'push'
        run: |
          $bannerPath = "docs/assets/release-banners/cafe-launcher-${{ github.ref_name }}-release-banner.png"
          if (-not (Test-Path $bannerPath -PathType Leaf)) {
            throw "Release banner must be committed to the source repository: $bannerPath"
          }
          Write-Host "Using repository release banner: $bannerPath"

      - name: Upload platform packages
        uses: actions/upload-artifact@v7
        with:
          name: distribution-packages
          path: artifacts/distribution/*
          retention-days: 1

      - name: Upload win-x64 publish output
        uses: actions/upload-artifact@v7
        with:
          name: publish-win-x64
          path: artifacts/publish/win-x64/
          retention-days: 1

      - name: Upload changelog
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: changelog
          path: changelog.md
          retention-days: 1

  installer:
    name: Release tests and Windows installer
    runs-on: windows-latest
    needs: build
    timeout-minutes: 25

    defaults:
      run:
        shell: pwsh

    env:
      Project_Path: src/Cafe.Launcher.Avalonia/Cafe.Launcher.Avalonia.csproj
      INNO_SETUP_VERSION: 7.1.0
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      AVALONIA_TELEMETRY_OPTOUT: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Install Inno Setup 7
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assetName = "innosetup-$env:INNO_SETUP_VERSION-x64.exe"
          $releaseTag = "is-$($env:INNO_SETUP_VERSION.Replace('.', '_'))"
          $installerPath = Join-Path $env:RUNNER_TEMP $assetName

          gh release download $releaseTag `
              --repo jrsoftware/issrc `
              --pattern $assetName `
              --dir $env:RUNNER_TEMP `
              --clobber
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to download Inno Setup $env:INNO_SETUP_VERSION."
          }

          gh release verify-asset $releaseTag $installerPath --repo jrsoftware/issrc
          if ($LASTEXITCODE -ne 0) {
              throw "GitHub release attestation verification failed for $assetName."
          }

          $process = Start-Process -FilePath $installerPath `
              -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' `
              -Wait `
              -PassThru
          if ($process.ExitCode -ne 0) {
              throw "Inno Setup installation failed with exit code $($process.ExitCode)."
          }

          $isccPath = Join-Path $env:ProgramFiles 'Inno Setup 7\ISCC.exe'
          $installedVersion = (& $isccPath --version | Select-Object -First 1)
          if ($LASTEXITCODE -ne 0 -or $installedVersion -notmatch '^7\.') {
              throw "Expected Inno Setup 7.x, found '$installedVersion'."
          }
          Write-Host "Using Inno Setup $installedVersion"

      - name: Test
        run: .\test.ps1 -Configuration Release

      - name: Download win-x64 publish output
        uses: actions/download-artifact@v8
        with:
          name: publish-win-x64
          path: artifacts/publish/win-x64

      - name: Build Windows installer
        run: |
          $tagArguments = @{}
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
              $tagArguments.Tag = '${{ github.ref_name }}'
          }
          ./scripts/New-WindowsInstaller.ps1 @tagArguments

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: installer-package
          path: artifacts/distribution/Cafe.Launcher.Avalonia_*_setup.exe
          retention-days: 1

  release:
    name: Publish GitHub releases
    runs-on: ubuntu-latest
    needs: [ build, installer ]
    if: github.event_name == 'push'
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v8
        with:
          name: distribution-packages
          path: artifacts/distribution

      - name: Download Windows installer
        uses: actions/download-artifact@v8
        with:
          name: installer-package
          path: artifacts/distribution

      - name: Download changelog
        uses: actions/download-artifact@v8
        with:
          name: changelog
          path: .

      - name: Create source repository release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: changelog.md
          files: |
            artifacts/distribution/Cafe.Launcher.Avalonia_${{ github.ref_name }}_win-x64.zip
            artifacts/distribution/Cafe.Launcher.Avalonia_${{ github.ref_name }}_setup.exe
            artifacts/distribution/Cafe.Launcher.Avalonia_${{ github.ref_name }}_osx-arm64.zip
            artifacts/distribution/Cafe.Launcher.Avalonia_${{ github.ref_name }}_linux-x64.tar.gz
            artifacts/distribution/Cafe.Launcher.Avalonia_${{ github.ref_name }}_linux-x64.AppImage
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true

      - name: Create distribution repository release
        uses: softprops/action-gh-release@v3
        with:
          # Keep in sync with LauncherConstants.GitHubReleaseRepositorySlug
          repository: bluearchive-cafe/Cafe.Launcher.Avalonia_Release
          token: ${{ secrets.RELEASE_REPOSITORY_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: changelog.md
          files: |
            artifacts/distribution/Cafe.Launcher.Avalonia_${{ github.ref_name }}_win-x64.zip
            artifacts/distribution/Cafe.Launcher.Avalonia_${{ github.ref_name }}_setup.exe
            artifacts/distribution/Cafe.Launcher.Avalonia_${{ github.ref_name }}_osx-arm64.zip
            artifacts/distribution/Cafe.Launcher.Avalonia_${{ github.ref_name }}_linux-x64.tar.gz
            artifacts/distribution/Cafe.Launcher.Avalonia_${{ github.ref_name }}_linux-x64.AppImage
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
