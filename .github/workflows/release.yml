name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest

    env:
      Project_Path: Cafe.Launcher.Avalonia.csproj
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      AVALONIA_TELEMETRY_OPTOUT: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build (Release)
        run: dotnet build $env:Project_Path -c Release

      - name: Publish
        run: dotnet publish $env:Project_Path -c Release -o publish

      - name: Create ZIP archive
        run: |
          $tag = "${{ github.ref_name }}"
          $zipName = "Cafe.Launcher.Avalonia_$tag.zip"
          Compress-Archive -Path publish\* -DestinationPath $zipName
          Write-Host "Created $zipName"
          "zip_name=$zipName" >> $env:GITHUB_ENV

      - name: Generate changelog
        shell: pwsh
        run: |
          $lastTag = git describe --tags --abbrev=0 ${{ github.ref }}^ 2>$null
          if ($lastTag) {
            Write-Host "Last tag: $lastTag"
            $log = git log "$lastTag..${{ github.ref }}" --oneline --no-decorate
          } else {
            Write-Host "No previous tag — using all commits"
            $log = git log --oneline --no-decorate ${{ github.ref }}
          }

          $body = @()
          $body += "## What's Changed"
          $body += ""

          if (-not $log) {
            $body += "Initial release."
          } else {
            foreach ($line in ($log -split "`n" | Where-Object { $_ -match '\S' })) {
              $line = $line.Trim()
              if ($line -match '^[a-f0-9]+\s+(.+)$') {
                $message = $Matches[1]
                # Strip conventional commit prefix for cleaner display
                $message = $message -replace '^(feat|feature|fix|refactor|perf|docs|chore|ci|test|build|style)(\(.+?\))?!?:\s*', ''
                $body += "- $message"
              }
            }
          }

          $body -join "`n" | Out-File -FilePath changelog.md -Encoding utf8
          Write-Host "Changelog generated"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: changelog.md
          files: ${{ env.zip_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
