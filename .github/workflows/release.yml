name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    env:
      Project_Path: Cafe.Launcher.Avalonia.csproj
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      AVALONIA_TELEMETRY_OPTOUT: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore tests/Cafe.Launcher.Avalonia.Tests/Cafe.Launcher.Avalonia.Tests.csproj -r win-x64

      - name: Test
        run: dotnet test tests/Cafe.Launcher.Avalonia.Tests/Cafe.Launcher.Avalonia.Tests.csproj -c Release -r win-x64 --no-restore

      - name: Build (Release)
        run: dotnet build $env:Project_Path -c Release -r win-x64 --no-restore

      - name: Publish
        run: dotnet publish $env:Project_Path -c Release -r win-x64 -o publish --no-restore

      - name: Create ZIP archive
        run: |
          $tag = "${{ github.ref_name }}"
          $zipName = "Cafe.Launcher.Avalonia_$tag.zip"
          Compress-Archive -Path publish\* -DestinationPath $zipName
          Write-Host "Created $zipName"
          "zip_name=$zipName" >> $env:GITHUB_ENV

      - name: Prepare changelog
        shell: pwsh
        run: |
          if (Test-Path "CHANGELOG_RELEASE.md") {
            Copy-Item "CHANGELOG_RELEASE.md" "changelog.md"
            Write-Host "Using maintained CHANGELOG_RELEASE.md"
          } else {
            $lastTag = git describe --tags --abbrev=0 ${{ github.ref }}^ 2>$null
            $parameters = @{
              CurrentRef = "${{ github.ref }}^"
              OutputPath = "changelog.md"
            }
            if ($lastTag) {
              Write-Host "Last tag: $lastTag"
              $parameters.PreviousTag = $lastTag
            } else {
              Write-Host "No previous tag — using all commits"
            }
            .\scripts\New-ReleaseChangelog.ps1 @parameters
            Write-Host "Fallback changelog generated"
          }

      - name: Create source repository release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: changelog.md
          files: ${{ env.zip_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true

      - name: Create distribution repository release
        uses: softprops/action-gh-release@v2
        with:
          # Keep in sync with LauncherConstants.GitHubReleaseRepositorySlug
          repository: bluearchive-cafe/Cafe.Launcher.Avalonia_Release
          token: ${{ secrets.RELEASE_REPOSITORY_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: changelog.md
          files: ${{ env.zip_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
